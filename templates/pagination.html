<div class="pagination"><span>{{ page.paginator.count }} records · Page {{ page.number }} of {{ page.paginator.num_pages }}</span><div>{% if page.has_previous %}<a data-page="{{ page.previous_page_number }}" href="?page={{ page.previous_page_number }}">Previous</a>{% endif %}{% if page.has_next %}<a data-page="{{ page.next_page_number }}" href="?page={{ page.next_page_number }}">Next</a>{% endif %}</div></div>
