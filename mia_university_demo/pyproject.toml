[project]
name = "secflow-mia-demo"
version = "0.1.0"
description = "Explainable synthetic MIA-style fraud demo for a university project"
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pandas>=2.2,<3",
  "numpy>=2.1,<3",
  "scikit-learn>=1.5,<2",
  "sqlalchemy>=2.0,<3",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
mia-demo = "mia_demo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mia_demo"]

[tool.vercel]
entrypoint = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
